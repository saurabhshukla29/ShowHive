version: "3.8"

services:
  server:
    build: ./Server
    image: showhive-server
    ports:
      - "8000:8000"
    env_file:
      - ./Server/.env
    restart: unless-stopped

  client:
    build:
      context: ./Client
      args:
        REACT_APP_BASE_URL: ${REACT_APP_BASE_URL}
        REACT_APP_RAZORPAY_KEY: ${REACT_APP_RAZORPAY_KEY}
    image: showhive-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped